# Precompressed files without an nginx Brotli module.
# Normalize RFC quality values, then compare the first differing digit.
map $http_accept_encoding $eo_wasm_br_quality {
    default 0;
    "~*(?:^|,)\s*br\s*;\s*q=(?<eo_br_quality>0(?:\.[0-9]{0,3})?|1(?:\.0{0,3})?)\s*(?:,|$)" $eo_br_quality;
    "~*(?:^|,)\s*br\s*(?:,|$)" 1;
}
map $eo_wasm_br_quality $eo_wasm_br_q {
    default 0000;
    "~^1(?:\.0{0,3})?$" 1000;
    "~^0\.(?<eo_br_d1>[0-9]{1})$" "0${eo_br_d1}00";
    "~^0\.(?<eo_br_d2>[0-9]{2})$" "0${eo_br_d2}0";
    "~^0\.(?<eo_br_d3>[0-9]{3})$" "0${eo_br_d3}";
}
map $http_accept_encoding $eo_wasm_gzip_quality {
    default 0;
    "~*(?:^|,)\s*gzip\s*;\s*q=(?<eo_gzip_quality>0(?:\.[0-9]{0,3})?|1(?:\.0{0,3})?)\s*(?:,|$)" $eo_gzip_quality;
    "~*(?:^|,)\s*gzip\s*(?:,|$)" 1;
}
map $eo_wasm_gzip_quality $eo_wasm_gzip_q {
    default 0000;
    "~^1(?:\.0{0,3})?$" 1000;
    "~^0\.(?<eo_gzip_d1>[0-9]{1})$" "0${eo_gzip_d1}00";
    "~^0\.(?<eo_gzip_d2>[0-9]{2})$" "0${eo_gzip_d2}0";
    "~^0\.(?<eo_gzip_d3>[0-9]{3})$" "0${eo_gzip_d3}";
}
map "$eo_wasm_br_q:$eo_wasm_gzip_q" $eo_wasm_encoding {
    default br;
    "0000:0000" "";
    "~^0[0-9]{3}:1000$" gzip;
    "~^0(?<eo_quality_same_0>[0-9]{0,2})0[0-9]*:0\k<eo_quality_same_0>[1-9][0-9]*$" gzip;
    "~^0(?<eo_quality_same_1>[0-9]{0,2})1[0-9]*:0\k<eo_quality_same_1>[2-9][0-9]*$" gzip;
    "~^0(?<eo_quality_same_2>[0-9]{0,2})2[0-9]*:0\k<eo_quality_same_2>[3-9][0-9]*$" gzip;
    "~^0(?<eo_quality_same_3>[0-9]{0,2})3[0-9]*:0\k<eo_quality_same_3>[4-9][0-9]*$" gzip;
    "~^0(?<eo_quality_same_4>[0-9]{0,2})4[0-9]*:0\k<eo_quality_same_4>[5-9][0-9]*$" gzip;
    "~^0(?<eo_quality_same_5>[0-9]{0,2})5[0-9]*:0\k<eo_quality_same_5>[6-9][0-9]*$" gzip;
    "~^0(?<eo_quality_same_6>[0-9]{0,2})6[0-9]*:0\k<eo_quality_same_6>[7-9][0-9]*$" gzip;
    "~^0(?<eo_quality_same_7>[0-9]{0,2})7[0-9]*:0\k<eo_quality_same_7>[8-9][0-9]*$" gzip;
    "~^0(?<eo_quality_same_8>[0-9]{0,2})8[0-9]*:0\k<eo_quality_same_8>9[0-9]*$" gzip;
}
map $eo_wasm_encoding $eo_wasm_suffix {
    default "";
    br .br;
    gzip .gz;
}

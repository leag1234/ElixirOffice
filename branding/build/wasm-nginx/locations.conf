# This include must precede the general SDK static locations.
location ~ ^(?:/[0-9]+\.[0-9]+\.[0-9]+[.-][A-Za-z0-9_]+)?/(sdkjs/common/clientpdf/runtime/current\.json)$ {
    types { }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    gzip off;
    gzip_static off;
    alias @ROOT@/$1;
}
location ~ ^(?:/[0-9]+\.[0-9]+\.[0-9]+[.-][A-Za-z0-9_]+)?/(?<eo_wasm_file>sdkjs/common/clientpdf/runtime/[0-9a-f]+-[0-9a-f]+-st/x2t\.wasm)$ {
    types { }
    default_type application/wasm;
    gzip off;
    gzip_static off;
    add_header Content-Encoding $eo_wasm_encoding;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    alias @ROOT@/$eo_wasm_file$eo_wasm_suffix;
}
location ~ ^(?:/[0-9]+\.[0-9]+\.[0-9]+[.-][A-Za-z0-9_]+)?/(?<eo_wasm_js>sdkjs/common/clientpdf/runtime/[0-9a-f]+-[0-9a-f]+-st/x2t\.js)$ {
    types { }
    default_type application/javascript;
    gzip off;
    gzip_static off;
    add_header Content-Encoding $eo_wasm_encoding;
    add_header Vary Accept-Encoding always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    alias @ROOT@/$eo_wasm_js$eo_wasm_suffix;
}

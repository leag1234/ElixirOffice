# HTTPS for the LAN test instance (Local Font Access API needs a secure context).
# Own compose project: does not touch the demo gateway (80/443) nor the dev container.
name: eo-lan-https
services:
  caddy:
    image: caddy:2
    container_name: eo-lan-https
    restart: unless-stopped
    # Published port (not host network): the host firewall (ufw, default drop) does not filter Docker-published
    # ports, so the LAN can reach 8443. Only 8443 is bound; the Caddy admin API is off.
    ports:
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:

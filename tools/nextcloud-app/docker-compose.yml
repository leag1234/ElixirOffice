# SPDX-License-Identifier: AGPL-3.0-only
# Local Nextcloud for ElixirOffice development and tests (docs/storage.md).
# Own compose project and network ("elixir-nc"); never touches the main dev
# container "eo". Started by setup.sh, which also connects the document server
# container to this network and configures the ElixirOffice app.
name: elixir-nc
services:
  nextcloud:
    image: nextcloud:${NC_VERSION:-latest}
    container_name: ${NC_CONTAINER:-elixir-nextcloud}
    ports:
      - "${NC_PORT:-8191}:80"
    volumes:
      - nc_data:/var/www/html
      # the rebranded app (fork of eurooffice-nextcloud, branch elixir/nc), built in place
      - ${NC_APP_DIR:?set NC_APP_DIR}:/var/www/html/custom_apps/elixiroffice:ro
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      # generated by setup.sh into a local env file (mode 600), never committed
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?set NC_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 172.17.0.1 ${NC_CONTAINER:-elixir-nextcloud}
networks:
  default:
    name: elixir-nc
volumes:
  nc_data:
    name: elixir_nc_data_${NC_VERSION:-latest}
